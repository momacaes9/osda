name: Deploy to Vercel

# Publishes https://osda-tau.vercel.app on every push to main (no local folder needed).
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   VERCEL_TOKEN = a token from https://vercel.com/account/tokens
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN secret is missing — add it in Settings → Secrets and variables → Actions to enable auto-deploy."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22

      - name: Deploy to production
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@65.16.0 deploy --prod --yes --force --token "$VERCEL_TOKEN"

      - name: Smoke test
        if: env.VERCEL_TOKEN != ''
        run: |
          sleep 5
          curl -fsS https://osda-tau.vercel.app/api/health
